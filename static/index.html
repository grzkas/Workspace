<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
header class="topbar">
    <h1>Workspace</h1>

    <div class="controls">
      <fieldset class="tile-toggles" aria-label="Widoczność kafelków">
        <label><input type="checkbox" data-toggle="tasks"> Zadania</label>
        <label><input type="checkbox" data-toggle="notes"> Notatki</label>
        <label><input type="checkbox" data-toggle="pomodoro"> Pomodoro</label>
      </fieldset>

      <label class="theme-picker">
        Motyw
        <select id="theme-select">
          <option value="light">Jasny</option>
          <option value="dark">Ciemny</option>
          <option value="ocean">Ocean</option>
          <option value="forest">Las</option>
        </select>
      </label>
    </div>
  </header>

  <main id="grid" class="grid">

    /* Kafelek zadania*/
    <section class="tile" data-tile="tasks">
      <div class="tile-head">
        <span class="drag-handle" title="Przeciągnij, aby zmienić kolejność" aria-label="Uchwyt przeciągania">⠿</span>
        <h2>Zadania</h2>
        <span id="tasks-count" class="badge">0</span>
      </div>

      <form id="task-form" class="row">
        <input id="task-title" type="text" placeholder="Nowe zadanie…" maxlength="200" required>
        <select id="task-priority" aria-label="Priorytet">
          <option value="low">Niski</option>
          <option value="medium" selected>Średni</option>
          <option value="high">Wysoki</option>
        </select>
        <button type="submit">Dodaj</button>
      </form>

      <ul id="task-list" class="task-list"></ul>
      <p id="tasks-empty" class="muted" hidden>Brak zadań. Dodaj pierwsze!</p>
    </section>

    /*kafelek notatki*/
    <section class="tile" data-tile="notes">
      <div class="tile-head">
        <span class="drag-handle" title="Przeciągnij, aby zmienić kolejność" aria-label="Uchwyt przeciągania">⠿</span>
        <h2>Szybki notatnik</h2>
        <span id="note-status" class="muted small">—</span>
      </div>

      <div class="row">
        <select id="note-select" aria-label="Wybierz notatkę"></select>
        <button id="note-new" type="button">Nowa</button>
        <button id="note-delete" type="button" class="danger">Usuń</button>
      </div>

      <input id="note-title" type="text" placeholder="Tytuł notatki" maxlength="100">
      <textarea id="note-content" rows="10" placeholder="Pisz tutaj – zapisuje się automatycznie…"></textarea>
    </section>

    /*kafelek pomodoro*/
    <section class="tile" data-tile="pomodoro">
      <div class="tile-head">
        <span class="drag-handle" title="Przeciągnij, aby zmienić kolejność" aria-label="Uchwyt przeciągania">⠿</span>
        <h2>Timer Pomodoro</h2>
        <span id="pomo-mode" class="badge">Praca</span>
      </div>

      <div id="pomo-time" class="pomo-time" role="timer" aria-live="off">25:00</div>

      <div class="row center">
        <button id="pomo-start" type="button">Start</button>
        <button id="pomo-reset" type="button" class="secondary">Reset</button>
        <button id="pomo-skip" type="button" class="secondary">Pomiń</button>
      </div>

      <div class="row center durations">
        <label>Praca (min)
          <input id="pomo-work" type="number" min="1" max="120" value="25">
        </label>
        <label>Przerwa (min)
          <input id="pomo-break" type="number" min="1" max="120" value="5">
        </label>
      </div>

      <div class="stats">
        <div><strong id="pomo-today">0</strong><span>dziś</span></div>
        <div><strong id="pomo-total">0</strong><span>łącznie</span></div>
        <div><strong id="pomo-minutes">0</strong><span>minut</span></div>
      </div>
    </section>

  </main>
    
     <script src="/static/app.js"></script>
</body>
</html>
